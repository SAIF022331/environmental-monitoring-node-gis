<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environmental Monitoring Web GIS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #1b4332; }
        #map { height: 500px; width: 100%; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-earth-asia me-2"></i> Environmental Monitoring Web GIS
            </a>
            <span class="text-light small">Node.js + Express + PostGIS Database</span>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="card border-0 shadow-sm p-3">
                    <h4 class="fw-bold text-success mb-1">Live Database Map</h4>
                    <p class="text-muted mb-0">Stations fetched dynamically from PostgreSQL/PostGIS via Express API.</p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div id="map"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map centered on Pakistan
        const map = L.map('map').setView([30.3753, 69.3451], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Fetch stations from Node.js Express API and add to map
        fetch('/api/stations')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        const p = feature.properties;
                        layer.bindPopup(`
                            <div style="min-width: 150px;">
                                <h6 class="fw-bold text-success mb-1">${p.station_name}</h6>
                                <p class="mb-1 small"><strong>Rainfall: ` + p.rainfall_mm + ` mm</strong></p>
                                <p class="mb-1 small"><strong>Risk Level: ` + p.risk_level + `</strong></p>
                                <p class="mb-0 text-muted small">Date: ` + p.observation_date + `</p>
                            </div>
                        `);
                    }
                }).addTo(map);
            })
            .catch(err => console.error("Error loading stations:", err));
    </script>
</body>
</html>
